name = "vtt-status"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Binds vtt.nixxon.se straight to this Worker. Cloudflare provisions and
# manages the DNS record automatically as part of `wrangler deploy`, as long
# as the nixxon.se zone lives in the same Cloudflare account as the deploy
# token used.
routes = [
  { pattern = "vtt.nixxon.se", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
# Every 10 minutes: 5 instances x 144 runs/day = 720 status writes/day to
# STATUS_KV, comfortably under Cloudflare's free-tier cap of 1,000 KV
# writes/day/account (a 2-minute schedule would blow through it at ~3,600/day).
# If you add instances or want tighter freshness, recompute:
#   writes/day = instance_count * (1440 / interval_minutes)
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "STATUS_KV"
id = "57c8d0229d4645f7904d45303667a2ac"
